name: Monitor de Lançamentos MultiCanaisHD

on:
  # Agendamento migrado para o Worker `cron-worker` (ver README de cron-worker/), que chama
  # direto o endpoint /api/cron/notificar. Mantido via workflow_dispatch para rollback manual.
  workflow_dispatch: # Permite rodar manualmente pelo painel do GitHub

concurrency:
  group: monitor-lancamentos
  cancel-in-progress: true

jobs:
  ping_vercel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm install

      - name: Run Notificador MultiCanaisHD
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ADMIN_MODERATION_TOKEN: ${{ secrets.ADMIN_MODERATION_TOKEN }}
          UPTASH_REDIS_URL_KV_REST_API_URL: ${{ secrets.UPTASH_REDIS_URL_KV_REST_API_URL }}
          UPTASH_REDIS_URL_KV_REST_API_TOKEN: ${{ secrets.UPTASH_REDIS_URL_KV_REST_API_TOKEN }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          KEY_API_TMDB: ${{ secrets.KEY_API_TMDB }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          DISCORD_WEBHOOK_LAUNCHES: ${{ secrets.DISCORD_WEBHOOK_LAUNCHES }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_AUTOPUBLISH_BOT_TOKEN: ${{ secrets.DISCORD_AUTOPUBLISH_BOT_TOKEN }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
          PUBLIC_SITE_URL: https://multicanaishd.lol
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DISABLE_REDIS: true
        run: |
          node frontend/scratch/run-notificar.js
