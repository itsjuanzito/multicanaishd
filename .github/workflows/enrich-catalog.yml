name: Enriquecimento incremental do catálogo (sitemap)

on:
  # Agendamento migrado para o Worker `cron-worker` (ver README de cron-worker/).
  # Mantido via workflow_dispatch.
  #
  # NOTA: o domínio da URL abaixo precisa ser o canônico ATUAL. Estava em multicanaishd.lol (e
  # o agendamento real, no cron-worker, apontava para multicanaishd.lol, hoje NXDOMAIN) — nos
  # dois casos o curl não falha, porque 3xx não é erro para o `curl -f`, então o disparo
  # manual "passava" sem enriquecer nada.
  workflow_dispatch:

concurrency:
  group: enrich-catalog
  cancel-in-progress: true

jobs:
  enrich_catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar endpoint interno de enriquecimento
        run: |
          curl -f "https://multicanaishd.lol/api/internal/enrich-catalog?secret=${{ secrets.CRON_SECRET }}"
